name: Sync lab projects

# Looks at the Virtual Company org for repos tagged with the lab topic and pins each one to an exact commit in data/lock.json.
# Netlify then rebuilds from the pinned commits only. The org's repos never push into this repo and never run code here.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover and pin
        env:
          LAB_GH_TOKEN: ${{ secrets.LAB_GH_TOKEN }}
        run: node scripts/discover.mjs
      - name: Commit the lockfile if it changed
        run: |
          if [ -n "$(git status --porcelain data/lock.json)" ]; then
            git config user.name "lab-sync"
            git config user.email "lab-sync@users.noreply.github.com"
            git add data/lock.json
            git commit -m "sync: pin lab projects"
            git push
          fi
